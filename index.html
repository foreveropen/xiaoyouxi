<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>合成大西瓜 · 物理小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #1a1a2e;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #2d3561 0%, #1a1a2e 70%);
  }
  #game-wrap {
    position: relative;
    width: 420px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
    border-radius: 12px;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 5;
  }
  .score-box {
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .score-box .label {
    font-size: 11px;
    opacity: .7;
    letter-spacing: 2px;
  }
  .score-box .value {
    font-size: 30px;
    font-weight: 800;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .next-box {
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .next-box .label {
    font-size: 11px;
    opacity: .7;
    letter-spacing: 2px;
    margin-bottom: 2px;
  }
  #next-emoji {
    font-size: 32px;
    line-height: 1;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.4));
  }
  #combo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 42px;
    font-weight: 900;
    color: #ffd166;
    text-shadow: 0 0 20px #ff9f1c, 0 4px 0 #b5651d;
    pointer-events: none;
    z-index: 6;
    transition: transform .15s ease-out;
  }
  #combo.show { transform: translate(-50%, -50%) scale(1.2); }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(20, 20, 40, .82);
    backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }
  #overlay h1 {
    color: #fff;
    font-size: 34px;
    margin-bottom: 8px;
  }
  #overlay p {
    color: rgba(255,255,255,.75);
    margin-bottom: 24px;
    font-size: 14px;
    line-height: 1.7;
    text-align: center;
  }
  #overlay .final-score {
    color: #ffd166;
    font-size: 48px;
    font-weight: 900;
    margin-bottom: 4px;
    font-variant-numeric: tabular-nums;
  }
  button {
    padding: 14px 44px;
    font-size: 17px;
    font-weight: 700;
    color: #1a1a2e;
    background: linear-gradient(135deg, #ffd166, #ff9f1c);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255, 159, 28, .4);
    transition: transform .1s;
  }
  button:active { transform: scale(.95); }
  #hint {
    position: absolute;
    bottom: 14px;
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,.45);
    font-size: 12px;
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>
<div id="app">
  <div id="game-wrap">
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="score-box">
        <div class="label">SCORE</div>
        <div class="value" id="score">0</div>
        <div class="label" style="margin-top:4px">BEST <span id="best">0</span></div>
      </div>
      <div class="next-box">
        <div class="label">NEXT</div>
        <div id="next-emoji">🍒</div>
      </div>
    </div>
    <div id="combo"></div>
    <div id="overlay">
      <h1 id="overlay-title">游戏结束</h1>
      <div class="final-score" id="final-score">0</div>
      <p id="overlay-desc">水果堆到红线啦<br/>再来一局，合成更大的西瓜吧！</p>
      <button id="restart">再来一局</button>
    </div>
    <div id="hint">移动鼠标 / 手指瞄准 · 点击掉落 · 相同水果碰撞合成</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
(() => {
  const { Engine, Render, Bodies, Body, Composite, Events, Vector } = Matter;

  // ===== 游戏区域尺寸 =====
  const W = 420, H = 720;
  const WALL = 30;
  const WARNING_Y = 105;
  const DROP_Y = 45;

  // ===== 水果等级表（越往后越大、分越高）=====
  const FRUITS = [
    { name: '樱桃',   r: 14, color: '#ff4d6d', emoji: '🍒', score: 1  },
    { name: '草莓',   r: 20, color: '#ff6b9d', emoji: '🍓', score: 3  },
    { name: '葡萄',   r: 27, color: '#9b5de5', emoji: '🍇', score: 6  },
    { name: '猕猴桃', r: 35, color: '#8ab17d', emoji: '🥝', score: 10 },
    { name: '橙子',   r: 44, color: '#ff9f1c', emoji: '🍊', score: 15 },
    { name: '苹果',   r: 54, color: '#e63946', emoji: '🍎', score: 21 },
    { name: '梨',     r: 65, color: '#a7c957', emoji: '🍐', score: 28 },
    { name: '桃',     r: 77, color: '#ffb4a2', emoji: '🍑', score: 36 },
    { name: '菠萝',   r: 90, color: '#ffd166', emoji: '🍍', score: 45 },
    { name: '西瓜',   r: 104,color: '#2d6a4f', emoji: '🍉', score: 100},
  ];
  const MAX_TIER = FRUITS.length - 1;

  // ===== Canvas =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  // ===== 物理引擎 =====
  const engine = Engine.create({ enableSleeping: true });
  engine.gravity.y = 1;
  const world = engine.world;

  // 静态墙：左 / 右 / 底
  const wallOpts = { isStatic: true, friction: 0.3, restitution: 0.2, label: 'wall' };
  const walls = [
    Bodies.rectangle(WALL/2, H/2, WALL, H*2, wallOpts),
    Bodies.rectangle(W - WALL/2, H/2, WALL, H*2, wallOpts),
    Bodies.rectangle(W/2, H - WALL/2, W*2, WALL*2, wallOpts),
  ];
  Composite.add(world, walls);

  // ===== 游戏状态 =====
  let score = 0;
  let best = parseInt(localStorage.getItem('merge_best') || '0', 10);
  let currentTier = 0;
  let nextTier = 0;
  let gameOver = false;
  let warningTimer = 0;
  let lastDropTime = 0;
  let lastMergeTime = 0;
  let comboCount = 0;
  let mouseX = W / 2;
  let shake = 0;
  let particles = [];
  let floatTexts = [];

  document.getElementById('best').textContent = best;

  // ===== 音效（WebAudio 合成，无外部资源）=====
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playBlip(tier) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    const freq = 300 + tier * 90;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.12);
    g.gain.setValueAtTime(0.18, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.3);
  }

  // ===== 生成水果 =====
  function spawnFruit(tier, x, y, opts = {}) {
    const f = FRUITS[tier];
    const body = Bodies.circle(x, y, f.r, {
      restitution: 0.35,
      friction: 0.05,
      frictionAir: 0.008,
      density: 0.001,
      label: 'fruit',
    });
    body.plugin.fruit = tier;
    body.plugin.birth = performance.now();
    body.plugin.merging = false;
    body.plugin.dropped = !!opts.dropped;
    Composite.add(world, body);
    return body;
  }

  function randomStartTier() {
    // 只从最小的 4 种里出，保证平衡
    return Math.floor(Math.random() * 4);
  }

  // ===== 粒子 & 飘分 =====
  function spawnParticles(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 2,
        life: 1,
        color,
        size: 3 + Math.random() * 4,
      });
    }
  }
  function addFloatText(x, y, text) {
    floatTexts.push({ x, y, text, life: 1 });
  }

  // ===== 合成逻辑（核心：由物理碰撞检测触发）=====
  Events.on(engine, 'collisionStart', (e) => {
    if (gameOver) return;
    for (const pair of e.pairs) {
      const a = pair.bodyA, b = pair.bodyB;
      if (a.label !== 'fruit' || b.label !== 'fruit') continue;
      if (a.plugin.merging || b.plugin.merging) continue;
      if (a.plugin.fruit !== b.plugin.fruit) continue;

      a.plugin.merging = b.plugin.merging = true;
      handleMerge(a, b);
    }
  });

  function handleMerge(a, b) {
    const tier = a.plugin.fruit;
    const x = (a.position.x + b.position.x) / 2;
    const y = (a.position.y + b.position.y) / 2;
    Composite.remove(world, a);
    Composite.remove(world, b);

    // 连击判定：1.2 秒内连续合成
    const now = performance.now();
    if (now - lastMergeTime < 1200) comboCount++; else comboCount = 1;
    lastMergeTime = now;

    if (tier < MAX_TIER) {
      const nb = spawnFruit(tier + 1, x, y);
      nb.plugin.dropped = true;
      const gain = FRUITS[tier + 1].score * comboCount;
      score += gain;
      addFloatText(x, y - FRUITS[tier + 1].r, '+' + gain + (comboCount > 1 ? '  x' + comboCount : ''));
      spawnParticles(x, y, FRUITS[tier + 1].color, 10 + tier * 2);
      playBlip(tier + 1);
      if (tier >= 6) shake = Math.min(14, 4 + tier);
      showCombo(comboCount);
    } else {
      // 两个西瓜合并 = 超级奖励
      score += 200 * comboCount;
      addFloatText(x, y, '西瓜爆炸 +' + 200 * comboCount);
      spawnParticles(x, y, '#ffd700', 40);
      playBlip(10);
      shake = 18;
    }
    updateScore();
  }

  function showCombo(n) {
    if (n < 2) return;
    const el = document.getElementById('combo');
    el.textContent = n + ' 连击!';
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    clearTimeout(showCombo._t);
    showCombo._t = setTimeout(() => el.classList.remove('show'), 700);
  }

  function updateScore() {
    document.getElementById('score').textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('merge_best', String(best));
      document.getElementById('best').textContent = best;
    }
  }

  // ===== 掉落 =====
  function dropFruit() {
    if (gameOver) return;
    const now = performance.now();
    if (now - lastDropTime < 350) return; // 防连点
    lastDropTime = now;

    const f = FRUITS[currentTier];
    const x = Math.max(WALL + f.r, Math.min(W - WALL - f.r, mouseX));
    spawnFruit(currentTier, x, DROP_Y, { dropped: true });

    currentTier = nextTier;
    nextTier = randomStartTier();
    document.getElementById('next-emoji').textContent = FRUITS[nextTier].emoji;
    warningTimer = 0;
  }

  // ===== 输入 =====
  function canvasX(clientX) {
    const rect = canvas.getBoundingClientRect();
    return (clientX - rect.left) / rect.width * W;
  }
  canvas.addEventListener('pointermove', (e) => { mouseX = canvasX(e.clientX); });
  canvas.addEventListener('pointerdown', (e) => {
    ensureAudio();
    mouseX = canvasX(e.clientX);
    dropFruit();
  });

  document.getElementById('restart').addEventListener('click', () => {
    ensureAudio();
    resetGame();
  });

  function resetGame() {
    // 清掉所有水果
    const all = Composite.allBodies(world);
    for (const b of all) {
      if (b.label === 'fruit') Composite.remove(world, b);
    }
    score = 0; comboCount = 0; warningTimer = 0;
    particles = []; floatTexts = [];
    gameOver = false;
    currentTier = randomStartTier();
    nextTier = randomStartTier();
    document.getElementById('next-emoji').textContent = FRUITS[nextTier].emoji;
    document.getElementById('score').textContent = '0';
    document.getElementById('overlay').classList.remove('show');
  }

  // ===== 游戏结束检测 =====
  function checkGameOver(dt) {
    if (gameOver) return;
    // 掉落之后给 1.2 秒缓冲，避免刚掉下来就判死
    if (performance.now() - lastDropTime < 1200) return;

    let danger = false;
    const bodies = Composite.allBodies(world);
    for (const b of bodies) {
      if (b.label !== 'fruit' || !b.plugin.dropped) continue;
      if (b.isSleeping || b.speed < 0.6) {
        if (b.position.y - b.circleRadius < WARNING_Y) { danger = true; break; }
      }
    }
    if (danger) {
      warningTimer += dt;
      if (warningTimer > 1300) endGame();
    } else {
      warningTimer = Math.max(0, warningTimer - dt * 2);
    }
  }

  function endGame() {
    gameOver = true;
    document.getElementById('final-score').textContent = score;
    document.getElementById('overlay').classList.add('show');
  }

  // ===== 渲染 =====
  function draw(now) {
    ctx.clearRect(0, 0, W, H);

    // 屏幕震动
    ctx.save();
    if (shake > 0.5) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.85;
    }

    // 背景
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#2d3561');
    bg.addColorStop(1, '#1a1a2e');
    ctx.fillStyle = bg;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 警告线
    ctx.strokeStyle = 'rgba(255, 77, 109, ' + (0.4 + 0.3 * Math.sin(now / 200)) + ')';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(WALL, WARNING_Y);
    ctx.lineTo(W - WALL, WARNING_Y);
    ctx.stroke();
    ctx.setLineDash([]);

    // 墙
    ctx.fillStyle = '#16213e';
    ctx.fillRect(0, 0, WALL, H);
    ctx.fillRect(W - WALL, 0, WALL, H);
    ctx.fillRect(0, H - WALL, W, WALL);

    // 瞄准线 + 当前水果投影
    if (!gameOver) {
      const cf = FRUITS[currentTier];
      const ax = Math.max(WALL + cf.r, Math.min(W - WALL - cf.r, mouseX));
      ctx.strokeStyle = 'rgba(255,255,255,.15)';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]);
      ctx.beginPath();
      ctx.moveTo(ax, DROP_Y + cf.r);
      ctx.lineTo(ax, H - WALL);
      ctx.stroke();
      ctx.setLineDash([]);
      drawFruitCircle(ax, DROP_Y, cf.r, cf.color, cf.emoji, 1, now, true);
    }

    // 物理世界里的水果
    const bodies = Composite.allBodies(world);
    for (const b of bodies) {
      if (b.label !== 'fruit') continue;
      const tier = b.plugin.fruit;
      const f = FRUITS[tier];
      // 出生弹入动画
      const age = now - b.plugin.birth;
      const scale = age < 200 ? 0.5 + 0.5 * Math.min(1, age / 200) : 1;
      drawFruitCircle(b.position.x, b.position.y, f.r * scale, f.color, f.emoji, 1, now, false, b.angle);
    }

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= 0.03;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 飘分
    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const t = floatTexts[i];
      t.y -= 1.2; t.life -= 0.02;
      if (t.life <= 0) { floatTexts.splice(i, 1); continue; }
      ctx.globalAlpha = t.life;
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(t.text, t.x, t.y);
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function drawFruitCircle(x, y, r, color, emoji, alpha, now, ghost, angle = 0) {
    ctx.save();
    ctx.globalAlpha = ghost ? 0.85 : alpha;

    // 球体渐变
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, lighten(color, 40));
    g.addColorStop(1, color);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    // 描边
    ctx.strokeStyle = 'rgba(0,0,0,.15)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // emoji
    if (r > 12) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ghost ? 0 : angle * 0.3);
      ctx.font = (r * 1.1) + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, 0, r * 0.05);
      ctx.restore();
    }
    ctx.restore();
  }

  function lighten(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
    r = Math.min(255, r); g = Math.min(255, g); b = Math.min(255, b);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // ===== 主循环 =====
  let lastTime = performance.now();
  function loop(now) {
    const dt = now - lastTime;
    lastTime = now;

    if (!gameOver) {
      Engine.update(engine, Math.min(dt, 33));
      checkGameOver(dt);
    }
    draw(now);
    requestAnimationFrame(loop);
  }

  // ===== 启动 =====
  currentTier = randomStartTier();
  nextTier = randomStartTier();
  document.getElementById('next-emoji').textContent = FRUITS[nextTier].emoji;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
